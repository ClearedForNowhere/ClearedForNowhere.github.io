# Site Build Settings

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "CLEARED FOR NOWHERE"
description:	       "CLEARED FOR NOWHERE is a personal project built around my passions for aviation, flight simulation, and photography."
author:              "CLEARED FOR NOWHERE"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      author: "CLEARED FOR NOWHERE"

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
